[package]
name = "K2Rmini"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
crossbeam-channel = "0.5"
libc = "0.2"
helicase = { version = "1.1", features = ["packed-seq"] }
simd-minimizers = "3.0"
regex = "1.13"
rustc-hash = "2.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.dev]
opt-level = 1
lto = "thin"
